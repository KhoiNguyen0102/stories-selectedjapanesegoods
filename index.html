<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#284555;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.page{max-width:1280px;margin:0 auto;background:#fff;overflow:hidden}
iframe.b{display:block;width:100%;border:0;overflow:hidden;background:transparent}
.sec{background:linear-gradient(135deg,#fdeef4 0%,#fff 55%,#eef5fb 100%);padding:6% 8.5% 2%}

.ns .img{width:100%;aspect-ratio:338/301}
.ns .txt .k{font-size:clamp(10px,1.6vw,15px);color:#5b7a8a;margin:0 0 3%}
.ns h3{font-family:Lora,Georgia,serif;font-weight:500;font-size:clamp(28px,5.4vw,60px);line-height:1.15;margin:0 0 4%;color:#284555}
.ns p{font-size:clamp(14px,1.9vw,19px);line-height:1.7;margin:0 0 5%;color:#355a6c}
.ns .btn{width:70%;aspect-ratio:279/59}
@media (max-width:700px){
 .sec{padding:10% 6% 3%}
 .ns{grid-template-columns:1fr;padding:6%;gap:20px}
 .ns .btn{width:75%}
 .news-link{width:100%}
}
</style>
</head>
<body>
<div class="page">
